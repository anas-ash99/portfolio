<?xml version="1.0" standalone="no"?>
<svg id="architecture-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="font-family: -apple-systems, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-width: 760px;">
        <defs>
          <!-- Arrow markers -->
          <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
          </marker>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
          </marker>
          <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
          </marker>
          <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
          </marker>
        </defs>

        <!-- Solid Background for Clean Export -->
        <rect x="0" y="0" width="1000" height="650" rx="14" fill="#0f172a"/>

        <!-- Title Banner inside SVG -->
        <text x="40" y="42" fill="#f8fafc" font-size="18" font-weight="700">PassGenius System Architecture &amp; Workflow</text>
        <text x="40" y="64" fill="#94a3b8" font-size="13">1. Runtime Request &amp; Authentication Flow   |   2. CI/CD &amp; Kubernetes GitOps Workflow</text>

        <!-- ========================================================= -->
        <!-- SECTION 1: RUNTIME ARCHITECTURE & WORKFLOW                -->
        <!-- ========================================================= -->

        <!-- Kubernetes Cluster Boundary -->
        <rect x="230" y="85" width="530" height="355" rx="14" fill="#1e293b" fill-opacity="0.55" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
        <text x="250" y="112" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="0.5">KUBERNETES CLUSTER</text>

        <!-- Client Node -->
        <rect x="35" y="210" width="130" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="100" y="248" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">User / Client</text>
        <text x="100" y="270" text-anchor="middle" fill="#94a3b8" font-size="12">Web / App Traffic</text>

        <!-- Kong Ingress Gateway Container -->
        <rect x="255" y="135" width="195" height="280" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
        <text x="352" y="162" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Kong Ingress Gateway</text>

        <!-- Open Ingress Box -->
        <rect x="273" y="180" width="160" height="82" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="353" y="210" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">Open Ingress</text>
        <text x="353" y="230" text-anchor="middle" fill="#cbd5e1" font-size="12">Public Access</text>
        <text x="353" y="247" text-anchor="middle" fill="#94a3b8" font-size="12">(No Token Required)</text>

        <!-- Authenticated Ingress Box -->
        <rect x="273" y="295" width="160" height="98" rx="9" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
        <text x="353" y="323" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">Authenticated Ingress</text>
        <text x="353" y="343" text-anchor="middle" fill="#cbd5e1" font-size="12">Kong JWT Plugin</text>
        <text x="353" y="361" text-anchor="middle" fill="#94a3b8" font-size="12">Validates Shared</text>
        <text x="353" y="377" text-anchor="middle" fill="#94a3b8" font-size="12">JWT Secret</text>

        <!-- Microservices Column inside K8s -->
        <!-- 1. Authentication Service -->
        <rect x="535" y="135" width="200" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="635" y="165" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Authentication Service</text>
        <text x="635" y="184" text-anchor="middle" fill="#38bdf8" font-size="12">Java / Spring Boot</text>
        <text x="635" y="200" text-anchor="middle" fill="#94a3b8" font-size="12">Verifies User &amp; Signs JWT</text>

        <!-- 2. User Service -->
        <rect x="535" y="235" width="200" height="75" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
        <text x="635" y="265" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">User Service</text>
        <text x="635" y="284" text-anchor="middle" fill="#34d399" font-size="12">Java / Spring Boot</text>
        <text x="635" y="300" text-anchor="middle" fill="#94a3b8" font-size="12">User Account Management</text>

        <!-- 3. Vault Service -->
        <rect x="535" y="335" width="200" height="75" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
        <text x="635" y="365" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Vault Service</text>
        <text x="635" y="384" text-anchor="middle" fill="#34d399" font-size="12">Java / Spring Boot</text>
        <text x="635" y="400" text-anchor="middle" fill="#94a3b8" font-size="12">Password &amp; Secret Vaults</text>

        <!-- 4. Email Service & Gmail SMTP (Right Column) -->
        <rect x="800" y="155" width="165" height="82" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
        <text x="882" y="185" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Email Service</text>
        <text x="882" y="204" text-anchor="middle" fill="#fbbf24" font-size="12">Go Microservice</text>
        <text x="882" y="222" text-anchor="middle" fill="#94a3b8" font-size="12">Notification Mailer</text>

        <rect x="800" y="305" width="165" height="75" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="882" y="338" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Gmail SMTP</text>
        <text x="882" y="358" text-anchor="middle" fill="#94a3b8" font-size="12">External Email Delivery</text>

        <!-- Runtime Workflow Arrows -->
        <!-- Step 1: Client -> Open Ingress -->
        <path d="M 165 235 L 270 220" fill="none" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
        <text x="215" y="212" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">1. Login / Register</text>

        <!-- Step 2: Open Ingress -> Auth Service -->
        <path d="M 433 215 L 532 178" fill="none" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
        <text x="484" y="182" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">2. Route</text>

        <!-- Shared JWT Secret dashed link between Auth Service & Kong JWT Plugin -->
        <path d="M 535 195 L 433 325" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="492" y="248" text-anchor="middle" fill="#cbd5e1" font-size="12">Issues JWT</text>

        <!-- Step 3: Client -> Authenticated Ingress -->
        <path d="M 165 275 L 270 340" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-green)"/>
        <text x="212" y="328" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">3. Request + JWT</text>

        <!-- Step 4a: Authenticated Ingress -> User Service -->
        <path d="M 433 335 L 532 280" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-green)"/>
        <text x="485" y="294" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">4. Verified</text>

        <!-- Step 4b: Authenticated Ingress -> Vault Service -->
        <path d="M 433 355 L 532 372" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-green)"/>

        <!-- Step 5: Email Notification Flow -->
        <path d="M 735 195 L 797 195" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
        <path d="M 882 237 L 882 302" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
        <text x="925" y="274" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">5. Send Mail</text>

        <!-- ========================================================= -->
        <!-- SECTION 2: CI/CD & GITOPS DEPLOYMENT WORKFLOW             -->
        <!-- ========================================================= -->
        <rect x="35" y="468" width="930" height="150" rx="14" fill="#1e293b" fill-opacity="0.55" stroke="#475569" stroke-width="1.5"/>
        <text x="55" y="495" fill="#c084fc" font-size="13" font-weight="700" letter-spacing="0.5">CI/CD &amp; KUBERNETES DEPLOYMENT WORKFLOW</text>

        <!-- Step A: GitLab Repos -->
        <rect x="55" y="515" width="175" height="78" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
        <text x="142" y="546" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">GitLab Repositories</text>
        <text x="142" y="566" text-anchor="middle" fill="#94a3b8" font-size="12">Service Source Code</text>

        <!-- Step B: Jenkins CI/CD -->
        <rect x="295" y="515" width="175" height="78" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
        <text x="382" y="546" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Jenkins Pipeline</text>
        <text x="382" y="566" text-anchor="middle" fill="#94a3b8" font-size="12">Build, Test &amp; Package</text>

        <!-- Step C: Docker Hub -->
        <rect x="535" y="515" width="175" height="78" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
        <text x="622" y="546" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Docker Hub Registry</text>
        <text x="622" y="566" text-anchor="middle" fill="#94a3b8" font-size="12">Tagged Container Images</text>

        <!-- Step D: Manifest Repo -->
        <rect x="770" y="515" width="175" height="78" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
        <text x="857" y="546" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Manifest Repository</text>
        <text x="857" y="566" text-anchor="middle" fill="#94a3b8" font-size="12">Kustomize K8s Overlays</text>

        <!-- CI/CD Arrows -->
        <path d="M 230 554 L 292 554" fill="none" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
        <text x="261" y="543" text-anchor="middle" fill="#cbd5e1" font-size="12">Push</text>

        <path d="M 470 554 L 532 554" fill="none" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
        <text x="501" y="543" text-anchor="middle" fill="#cbd5e1" font-size="12">Push Image</text>

        <path d="M 710 554 L 767 554" fill="none" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
        <text x="738" y="543" text-anchor="middle" fill="#cbd5e1" font-size="12">Update Tag</text>

        <!-- Manifest -> K8s Cluster arrow -->
        <path d="M 857 515 L 857 450 L 635 450 L 635 442" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
        <text x="755" y="464" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="600">Deploys to Cluster</text>
      </svg>